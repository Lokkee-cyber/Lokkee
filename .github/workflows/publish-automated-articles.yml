name: Publish automated articles

on:
  workflow_dispatch:
    inputs:
      category:
        description: Optional automation category to limit this run
        required: false
        default: ''

# Least privilege: the built-in token may only write repository contents.
permissions:
  contents: write

concurrency:
  group: publish-automated-articles
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Automation state is gitignored locally, so it is supplied through secrets.
      - name: Seed automation settings and sources
        env:
          AUTOMATION_SETTINGS_JSON: ${{ secrets.AUTOMATION_SETTINGS_JSON }}
          AUTOMATION_SOURCES_JSON: ${{ secrets.AUTOMATION_SOURCES_JSON }}
        run: |
          mkdir -p content/automation
          if [ -n "$AUTOMATION_SETTINGS_JSON" ]; then printf '%s' "$AUTOMATION_SETTINGS_JSON" > content/automation/settings.json; fi
          if [ -n "$AUTOMATION_SOURCES_JSON" ]; then printf '%s' "$AUTOMATION_SOURCES_JSON" > content/automation/sources.json; fi

      - name: Generate and auto-publish articles
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
          NEWSAPI_API_KEY: ${{ secrets.NEWSAPI_API_KEY }}
          CONTENT_CATEGORY: ${{ inputs.category }}
        run: node scripts/run-ci-content-update.mjs

      - name: Commit only published articles
        run: |
          outside=$(git status --porcelain --untracked-files=all | grep -v -E ' content/articles/[^/]+\.(json|draft)$' || true)
          if [ -n "$outside" ]; then
            echo "Unexpected changes outside content/articles/:"; echo "$outside"; exit 1
          fi
          git add -- 'content/articles/*.json'
          if git diff --cached --quiet; then
            echo "No new articles were published."; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "content: publish automated articles"
          git push
