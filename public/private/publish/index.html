<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Publish articles</title>
<style>
  body{font-family:system-ui,sans-serif;margin:0;padding:24px;background:#0f172a;color:#e2e8f0}
  main{max-width:420px;margin:0 auto}
  input,button{width:100%;box-sizing:border-box;font-size:18px;padding:14px;margin:8px 0;border-radius:10px;border:1px solid #475569}
  input{background:#1e293b;color:inherit}
  button{background:#2563eb;color:#fff;border:0;font-weight:600}
  button.secondary{background:#334155}
  button:disabled{opacity:.6}
  #msg{min-height:24px;margin:12px 0}
  li{margin:8px 0}
  a{color:#93c5fd}
</style>
</head>
<body>
<main>
  <h1>Publish articles</h1>
  <input id="password" type="password" placeholder="Admin password" autocomplete="current-password">
  <input id="category" type="text" placeholder="Category (optional)">
  <button id="run">Publish now</button>
  <button id="status" class="secondary">Check recent runs</button>
  <div id="msg" role="status"></div>
  <ul id="runs"></ul>
</main>
<script>
const $ = (id) => document.getElementById(id);
const headers = () => ({ Authorization: `Bearer ${$('password').value}`, 'Content-Type': 'application/json' });

async function call(options) {
  const response = await fetch('/api/publish-articles', { ...options, headers: headers() });
  const data = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(data.error || 'Request failed.');
  return data;
}

async function withButton(button, task) {
  button.disabled = true;
  $('msg').textContent = 'Working...';
  try { await task(); } catch (error) { $('msg').textContent = error.message; }
  button.disabled = false;
}

$('run').onclick = () => withButton($('run'), async () => {
  const data = await call({ method: 'POST', body: JSON.stringify({ category: $('category').value }) });
  $('msg').textContent = data.message;
});

$('status').onclick = () => withButton($('status'), async () => {
  const { runs } = await call({ method: 'GET' });
  $('msg').textContent = runs.length ? 'Recent runs:' : 'No runs yet.';
  $('runs').replaceChildren(...runs.map((run) => {
    const item = document.createElement('li');
    const link = document.createElement('a');
    link.href = run.url; link.target = '_blank'; link.rel = 'noopener';
    link.textContent = `${new Date(run.createdAt).toLocaleString()} - ${run.conclusion || run.status}`;
    item.append(link);
    return item;
  }));
});
</script>
</body>
</html>
